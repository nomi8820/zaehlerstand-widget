<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zählerstand melden – lokale Vorschau</title>
    <style>
      /* Stark vereinfachtes "Seiten-CSS" der Website – nicht Teil der Aufgabe. */
      body { margin: 0; font-family: system-ui, sans-serif; color: #1a1a1a; background: #f6f7f9; }
      header { background: #004b87; color: #fff; padding: 16px 24px; font-weight: 600; }
      main { max-width: 960px; margin: 0 auto; padding: 24px; display: grid; gap: 24px; }
      .zaehlerstand-teaser { background: #e5f0f9; padding: 20px; }
    </style>
  </head>
  <body>
    <!--
      Diese Seite simuliert eine vom CMS (FirstSpirit) generierte Seite.
      Das Markup der beiden Absätze unten entspricht der Ausgabe der AKTUELLEN
      Absatzvorlage aus cms/sectiontemplates/zaehlerstand_widget/ – mit zwei
      Instanzen auf derselben Seite.
    -->
    <header>GASAG Kundenportal · lokale Vorschau</header>
    <main>
      <!-- Absatz 1: Gas, mit Verlauf, eigene Erfolgsmeldung mit Anführungszeichen (von .convert2 escaped) -->
      <section class="zaehlerstand-teaser">
        <h2 class="zaehlerstand-teaser__headline">Zählerstand melden</h2>
        <div class="zaehlerstand-teaser__text"><p>Melde uns deinen aktuellen <b>Gaszählerstand</b> – so bekommst du eine genaue Abrechnung.</p></div>
        <div
          data-zaehlerstand-widget
          data-energy-type="gas"
          data-show-history="true"
          data-success-message="Danke! Wir haben deinen &quot;Gaszählerstand&quot; erhalten."
        ></div>
      </section>

      <!-- Absatz 2: Strom, ohne Verlauf, ohne Einleitungstext und Erfolgsmeldung (Standardtext) -->
      <section class="zaehlerstand-teaser">
        <h2 class="zaehlerstand-teaser__headline">Stromzähler ablesen</h2>
        <div
          data-zaehlerstand-widget
          data-energy-type="strom"
          data-show-history="false"
        ></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
