<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zählerstand melden – lokale Vorschau</title>
    <style>
      /* Stark vereinfachtes "Seiten-CSS" der Website – nicht Teil der Aufgabe. */

      header { background: #004b87; color: #fff; padding: 16px 24px; font-weight: 600; }
      main { max-width: 960px; margin: 0 auto; padding: 24px; display: grid; gap: 24px; }

    <!--
      Diese Seite simuliert eine vom CMS (FirstSpirit) generierte Seite.
      Das Markup der beiden Absätze unten entspricht der Ausgabe der AKTUELLEN
      Absatzvorlage aus cms/sectiontemplates/zaehlerstand_widget/ – mit zwei
      Instanzen auf derselben Seite.
    -->
    <header>GASAG Kundenportal · lokale Vorschau</header>
    <main>
      <!-- Absatz 1: Absatzvorlage "Zählerstand-Widget" -->
      <div class="teaser" style="background:#e5f0f9;padding:20px">
        <h2>Zählerstand melden</h2>
        <p>Melde uns deinen aktuellen Gaszählerstand – so bekommst du eine genaue Abrechnung.</p>
        <div data-zaehlerstand-widget></div>
      </div>

      <!-- Absatz 2: Absatzvorlage "Zählerstand-Widget" -->
      <div class="teaser" style="background:#e5f0f9;padding:20px">
        <h2>Stromzähler ablesen</h2>
        <p>Auch für deinen Stromzähler kannst du den Stand hier direkt übermitteln.</p>
        <div data-zaehlerstand-widget></div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
